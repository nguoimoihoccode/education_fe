<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Manrope:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>EduPro - Learning Platform</title>
    <script>
      try {
        const settings = JSON.parse(localStorage.getItem('edupro-settings') || '{}');
        if (settings?.state?.theme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (_) {}
    </script>
    <style>
      :root { color-scheme: dark; --boot-bg: #000000; --boot-surface: rgba(17, 17, 17, 0.9); --boot-text: #ffffff; --boot-muted: #d4d4d4; --boot-border: rgba(255, 255, 255, 0.12); }
      :root[data-theme="light"] { color-scheme: light; --boot-bg: #ffffff; --boot-surface: rgba(255, 255, 255, 0.92); --boot-text: #0f172a; --boot-muted: #475569; --boot-border: rgba(15, 23, 42, 0.12); }
      body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--boot-bg); }
      #root { min-height: 100vh; }
      .app-boot-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--boot-text);
        font-family: 'IBM Plex Sans', Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background:
          radial-gradient(circle at 18% 20%, rgba(16, 185, 129, 0.12), transparent 28%),
          radial-gradient(circle at 78% 18%, rgba(20, 184, 166, 0.1), transparent 30%),
          var(--boot-bg);
      }
      .app-boot-card {
        width: min(420px, 100%);
        border: 1px solid var(--boot-border);
        border-radius: 28px;
        padding: 28px;
        background: var(--boot-surface);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.36);
        backdrop-filter: blur(18px);
      }
      .app-boot-mark {
        width: 48px;
        height: 48px;
        border-radius: 16px;
        background: linear-gradient(135deg, #10b981, #8b5cf6);
        box-shadow: 0 0 32px rgba(16, 185, 129, 0.32);
      }
      .app-boot-title { margin: 18px 0 6px; font-size: 24px; font-weight: 700; letter-spacing: -0.03em; }
      .app-boot-text { margin: 0; color: var(--boot-muted); font-size: 14px; line-height: 1.6; }
      .app-boot-bar { height: 8px; margin-top: 24px; overflow: hidden; border-radius: 999px; background: color-mix(in srgb, var(--boot-muted) 16%, transparent); }
      .app-boot-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #10b981, #8b5cf6);
        animation: app-boot-slide 1.2s ease-in-out infinite;
      }
      @keyframes app-boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { .app-boot-bar::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-shell" role="status" aria-live="polite">
        <div class="app-boot-card">
          <div class="app-boot-mark" aria-hidden="true"></div>
          <h1 class="app-boot-title">EduPro</h1>
          <p class="app-boot-text">Đang chuẩn bị không gian học tập của bạn...</p>
          <div class="app-boot-bar" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
