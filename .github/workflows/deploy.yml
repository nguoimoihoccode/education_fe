name: Deploy Frontend

on:
  push:
    branches:
      - main
      - master
      - phuc_v2026
      - feat/ai-provider-settings
  workflow_dispatch:

concurrency:
  group: production-deploy-frontend
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  quality-gate:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build and push frontend image
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy frontend to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy frontend service
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,FRONTEND_IMAGE,IMAGE_TAG
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"
            test -f .env.prod
            test -f docker-compose.prod.yml

            previous_tag=""
            if [ -f .last-frontend-tag ]; then
              previous_tag="$(cat .last-frontend-tag)"
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export FRONTEND_IMAGE IMAGE_TAG
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull frontend
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans frontend

            wait_healthy() {
              for _ in $(seq 1 30); do
                curl --fail --show-error --silent http://127.0.0.1:8080/nginx-health && return 0
                sleep 5
              done
              return 1
            }

            rollback() {
              if [ -z "$previous_tag" ]; then
                echo "Health check failed and no previous tag exists for rollback." >&2
                docker compose -f docker-compose.prod.yml --env-file .env.prod ps
                exit 1
              fi

              echo "Health check failed. Rolling back to $previous_tag." >&2
              export IMAGE_TAG="$previous_tag"
              docker compose -f docker-compose.prod.yml --env-file .env.prod pull frontend
              docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans frontend
              wait_healthy
              exit 1
            }

            wait_healthy || rollback

            printf '%s' "$IMAGE_TAG" > .last-frontend-tag
            docker image prune -f --filter "until=168h"
            docker compose -f docker-compose.prod.yml --env-file .env.prod ps